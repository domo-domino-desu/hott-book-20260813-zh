name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build PDFs and publish release
    runs-on: ubuntu-latest
    container: danteev/texlive:2025-07-15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Consider all directories safe
        run: git config --global --add safe.directory '*'

      - name: Fetch all tags for `git describe`
        run: git fetch --force --prune --unshallow --tags || true

      - name: Compute release version (timestamp)
        id: version
        run: echo "version=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build PDFs
        run: |
          make hott-online.pdf
          make hott-ebook.pdf
          make hott-ebook-wide.pdf
          make hott-ebook-narrow.pdf
          make hott-a4.pdf
          make hott-letter.pdf

      - name: Rename PDFs with version
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"
          cp hott-online.pdf        "dist/hott-book-zh-online-${VERSION}.pdf"
          cp hott-ebook.pdf         "dist/hott-book-zh-ebook-${VERSION}.pdf"
          cp hott-ebook-wide.pdf    "dist/hott-book-zh-ebook-wide-${VERSION}.pdf"
          cp hott-ebook-narrow.pdf  "dist/hott-book-zh-ebook-narrow-${VERSION}.pdf"
          cp hott-a4.pdf            "dist/hott-book-zh-a4-${VERSION}.pdf"
          cp hott-letter.pdf        "dist/hott-book-zh-letter-${VERSION}.pdf"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hott-book-zh-pdfs-${{ steps.version.outputs.version }}
          path: dist/*.pdf

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: dist/*.pdf
          generate_release_notes: true
